<body class="page-404 theme-light" style="--page-art:url('/assets/scenes/not-found.webp');--page-art-sm:url('/assets/scenes/not-found-1280.webp')">
<div class="page-art" aria-hidden="true"></div>
<a class="skip-link" href="#main-content">Lewati ke konten utama</a>
<div class="grid"></div><div class="glow"></div>
<div class="langwrap"><button type="button" class="btn-lang" id="btnLang">EN</button></div>
<main id="main-content">
  <img class="logo" src="/assets/void_scriptor_emblem.webp" alt="Void Scriptor">
  <div class="code">404</div>
  <h1 data-i18n="h">Halaman tidak ditemukan.</h1>
  <p data-i18n="p">Tautan yang Anda tuju mungkin sudah dipindahkan, dihapus, atau tidak pernah ada. Mari kembali ke jalur yang dikenal.</p>
  <div class="actions">
    <a class="primary" href="/" data-i18n="home">← Kembali ke beranda</a>
    <a class="secondary" href="/#products" data-i18n="products">Jelajahi produk ↗</a>
  </div>
  <div class="links">
    <a href="/#downloads" data-i18n="l-download">Unduhan</a>
    <a href="/docs/getting-started">Mulai</a>
    <a href="/report-bug">Laporkan bug</a>
    <a href="/status">Status</a>
    <a href="/changelog" data-i18n="l-status">Status rilis</a>
    <a href="/#support" data-i18n="l-support">Dukungan</a>
  </div>
</main>
<script>
(function(){
  var dict={
    id:{h:'Halaman tidak ditemukan.',p:'Tautan yang Anda tuju mungkin sudah dipindahkan, dihapus, atau tidak pernah ada. Mari kembali ke jalur yang dikenal.',home:'← Kembali ke beranda',products:'Jelajahi produk ↗','l-download':'Unduhan','l-status':'Status rilis','l-support':'Dukungan'},
    en:{h:'Page not found.',p:'The link you followed may have been moved, removed, or never existed. Let us get you back on the known path.',home:'← Back to home',products:'Explore products ↗','l-download':'Download','l-status':'Release status','l-support':'Support'}
  };
  var btn=document.getElementById('btnLang');
  function apply(lang){
    document.documentElement.lang=lang;
    var t=dict[lang]||dict.id;
    document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(t[k])e.textContent=t[k]});
    btn.textContent=lang==='id'?'EN':'ID';
    // Share the ONE language key every other page uses ('vs-lang'); writing a
    // private key here meant the ID/EN choice silently reset on the error page.
    try{localStorage.setItem('vs-lang',lang);localStorage.removeItem('void-scriptor-lang')}catch(e){}
  }
  var saved='id';
  // Read the shared key first, then fall back to the retired one so a visitor
  // who already chose a language on an older error page keeps it.
  try{saved=localStorage.getItem('vs-lang')||localStorage.getItem('void-scriptor-lang')||'id'}catch(e){}
  if(!dict[saved])saved='id';
  apply(saved);
  btn.onclick=function(){apply(document.documentElement.lang==='id'?'en':'id')};
})();
</script>
