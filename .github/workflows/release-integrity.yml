name: Release integrity

on:
  push:
    branches: [main]
    paths:
      - 'release-manifests/**'
      - 'app/**'
      - 'preview-entry.txt'
      - 'docs/getting-started.html'
      - 'tools/verify-release.ps1'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-integrity.yml'
  workflow_dispatch:
    inputs:
      installer_url:
        description: 'URL installer RC yang akan diverifikasi (harus menunjuk ke artefak release yang dipublikasikan)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release metadata
    runs-on: ${{ inputs.installer_url && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run release and regression tests
        run: node --test test/*.mjs

      - name: Verify published installer
        if: ${{ inputs.installer_url != '' }}
        shell: pwsh
        env:
          INSTALLER_URL: ${{ inputs.installer_url }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'VoidScriptor-1.2.0-rc.2-windows-x64-setup.exe'
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $destination
          ./tools/verify-release.ps1 `
            -InstallerPath $destination `
            -ManifestPath './release-manifests/VoidScriptor-1.2.0-rc.2-windows-x64.sha256'

      - name: Check whitespace errors
        run: git diff --check --exit-code
