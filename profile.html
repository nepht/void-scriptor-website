<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f6fb">
<title>Profil : Void Scriptor</title>
<style>
@font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-serif-display-latin-400.woff2) format('woff2')}
@font-face{font-family:'Roboto Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/roboto-mono-latin-400.woff2) format('woff2')}
:root{--void:#050507;--surface:#0d0b12;--line:rgba(163,71,255,.24);--violet:#a347ff;--white:#fff8ff;--muted:rgba(240,233,255,.68);--faint:rgba(240,233,255,.42);--font-display:'DM Serif Display',Georgia,serif;--font-mono:'Roboto Mono',ui-monospace,monospace}
*{box-sizing:border-box}html{min-height:100%;background:var(--void)}body{min-height:100%;margin:0;position:relative;isolation:isolate;overflow-x:hidden;background:var(--void);color:var(--white);font-family:Inter,system-ui,'Segoe UI',sans-serif}body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,5,7,.34),rgba(5,5,7,.82) 78%,rgba(5,5,7,.94)),url('/assets/void-qowner-wallpaper.webp') center top/cover no-repeat;filter:saturate(.88) contrast(1.02)}body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url('/assets/grain.svg') center/360px repeat;opacity:.035;mix-blend-mode:soft-light}a{color:inherit;text-decoration:none}.shell{width:min(100% - 40px,960px);margin:auto}
header{position:relative;z-index:1;border-bottom:1px solid rgba(217,207,255,.12);background:rgba(5,5,7,.12)}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.16em}.brand img{width:32px;height:42px;object-fit:contain}.navlinks{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:12px}.navlinks a{min-height:44px;display:inline-flex;align-items:center}.navlinks a:hover{color:var(--white)}
main{position:relative;z-index:1;min-height:calc(100svh - 76px);min-height:calc(100dvh - 76px);display:grid;place-items:center;padding:56px 0 80px}.profile-stage{width:100%;max-width:680px}.eyebrow{color:#c7a6ff;font:700 10px/1.4 var(--font-mono);letter-spacing:.2em;text-transform:uppercase}.profile-card{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:rgba(13,11,18,.94);padding:clamp(24px,5vw,48px);box-shadow:0 18px 50px rgba(0,0,0,.28)}.profile-card[hidden]{display:none}.identity{display:flex;align-items:center;gap:20px}.avatar,.initial{width:86px;height:86px;flex:0 0 auto;border-radius:50%;border:1px solid rgba(163,71,255,.4)}.avatar{object-fit:cover}.initial{display:grid;place-items:center;background:#171125;color:#d9c6ff;font:400 32px var(--font-display)}.identity h1{margin:0;font:400 clamp(32px,6vw,50px)/1.05 var(--font-display);letter-spacing:-.03em;overflow-wrap:anywhere}.handle{margin:8px 0 0;color:var(--muted);font:400 12px var(--font-mono);overflow-wrap:anywhere}.bio{margin:28px 0 0;color:#eee7f7;font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:10px 20px;margin:28px 0 0;padding-top:18px;border-top:1px solid rgba(163,71,255,.14);color:var(--faint);font:400 11px/1.6 var(--font-mono)}.qowner{margin:18px 0 0;color:#d9c6ff;font-size:12px}.state{padding:28px;border:1px solid var(--line);border-radius:14px;background:rgba(13,11,18,.8);color:var(--muted);line-height:1.65}.state strong{display:block;margin-bottom:8px;color:var(--white);font:400 28px var(--font-display)}.state[hidden]{display:none}.back{display:inline-flex;align-items:center;min-height:44px;margin-top:24px;color:#d9c6ff;font-size:12px;text-decoration:underline;text-underline-offset:4px}.foot{margin-top:24px;color:var(--faint);font:400 10px var(--font-mono)}
@media(max-width:560px){.shell{width:min(100% - 28px,960px)}.nav{min-height:68px}.brand span{display:none}.navlinks{gap:4px}.navlinks a{padding:0 8px}.profile-card{padding:24px 20px}.identity{align-items:flex-start;flex-direction:column}.avatar,.initial{width:72px;height:72px}.initial{font-size:28px}main{min-height:calc(100svh - 68px);min-height:calc(100dvh - 68px);place-items:start center;padding:32px 0 56px}}
</style>
<link rel="stylesheet" href="/assets/light.css?v=light-cosmic-20261017e"></head>
<body class="theme-light" style="--page-art:url('/assets/scenes/profile.webp');--page-art-sm:url('/assets/scenes/profile-1280.webp')">
<div class="page-art" aria-hidden="true"></div>
<header><div class="shell nav"><a class="brand" href="/"><img src="/assets/void_scriptor_emblem.webp" alt=""><span>VOID SCRIPTOR</span></a><nav class="navlinks" aria-label="Navigasi profil"><a href="/">Beranda</a><a href="/contact">Kontak</a></nav></div></header>
<main><div class="shell profile-stage">
<span class="eyebrow">PROFIL PUBLIK</span>
<section class="state" id="profileLoading" role="status" aria-live="polite"><strong>Memuat profil…</strong>Profil sedang diperiksa.</section>
<section class="state" id="profileEmpty" hidden><strong>Profil tidak ditemukan</strong>Profil ini mungkin masih privat atau username-nya tidak tersedia.</section>
<article class="profile-card" id="profileCard" hidden>
<div class="identity"><img class="avatar" id="profileAvatar" alt="" hidden><i class="initial" id="profileInitial">V</i><div><h1 id="profileName">—</h1><p class="handle" id="profileHandle">—</p></div></div>
<p class="bio" id="profileBio" hidden></p>
<div class="meta"><span id="profileLocale">—</span><span id="profileTimezone">—</span></div>
<p class="qowner" id="profileQowner" hidden></p>
</article>
<a class="back" href="/">Kembali ke Void Scriptor</a>
<p class="foot">Profil ini hanya menampilkan informasi yang dipilih pemilik akun.</p>
</div></main>
<script>
(function(){
  var match=/^\/u\/([^/]+)\/?$/.exec(location.pathname),handle=match?decodeURIComponent(match[1]).toLowerCase():'';
  var loading=document.getElementById('profileLoading'),empty=document.getElementById('profileEmpty'),card=document.getElementById('profileCard');
  function showEmpty(){loading.hidden=true;empty.hidden=false;card.hidden=true}
  if(!/^[a-z0-9](?:[a-z0-9_-]{1,22}[a-z0-9])?$/.test(handle)){showEmpty();return}
  fetch('/api/public/profile?handle='+encodeURIComponent(handle),{credentials:'same-origin',cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('not-found');return r.json()})
    .then(function(data){
      var p=data.profile||{},name=p.display_name||p.public_handle||'Profil';
      document.title=name+' / @'+p.public_handle+' : Void Scriptor';
      document.getElementById('profileName').textContent=name;
      document.getElementById('profileHandle').textContent='@'+p.public_handle;
      document.getElementById('profileInitial').textContent=name.charAt(0).toUpperCase();
      if(p.avatar){var avatar=document.getElementById('profileAvatar');avatar.src=p.avatar;avatar.alt='Avatar '+name;avatar.hidden=false;document.getElementById('profileInitial').hidden=true;avatar.onerror=function(){avatar.hidden=true;document.getElementById('profileInitial').hidden=false}}
      if(p.bio){var bio=document.getElementById('profileBio');bio.textContent=p.bio;bio.hidden=false}
      document.getElementById('profileLocale').textContent=p.locale==='en'?'English':'Bahasa Indonesia';
      document.getElementById('profileTimezone').textContent=p.timezone||'Asia/Jakarta';
      if(p.qowner_alias){var q=document.getElementById('profileQowner');q.textContent='QOWNER: '+p.qowner_alias;q.hidden=false}
      loading.hidden=true;empty.hidden=true;card.hidden=false;
    })
    .catch(showEmpty);
})();
</script>
</body>
</html>
